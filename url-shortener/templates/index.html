<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raremotion URL Shortener</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <main class="container">

        <section class="card">

            <p class="brand">
                Raremotion Labs
            </p>

            <h1>
                URL Shortener
            </h1>

            <p class="subtitle">
                Paste a long link and turn it into a shorter one.
            </p>

            <form method="POST">

                <input
                    type="text"
                    name="url"
                    placeholder="https://example.com/very-long-link"
                    required
                >

                <button type="submit">
                    Shorten URL
                </button>

            </form>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            {% if short_url %}

                <div class="result">

                    <p>
                        Your short URL
                    </p>

                    <a
                        href="{{ short_url }}"
                        target="_blank"
                    >
                        {{ short_url }}
                    </a>

                </div>

            {% endif %}

        </section>

    </main>

</body>
</html>
