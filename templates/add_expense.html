<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense - RobotChat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #020617;
            color: #e2e8f0;
        }

        header {
            padding: 25px 8%;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            margin: 0;
            color: #38bdf8;
        }

        main {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 15px;
            padding: 30px;
        }

        h2 {
            margin-top: 0;
            color: #38bdf8;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #020617;
            color: #e2e8f0;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #020617;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>RobotChat</h1>
</header>

<main>

    <div class="card">

        <h2>Add Expense</h2>

        <form action="/add-expense" method="POST">

            <label for="item">
                Expense Item
            </label>

            <input
                type="text"
                id="item"
                name="item"
                placeholder="e.g. Food"
                autocomplete="off"
                required
            >

            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="e.g. 5000"
                min="0"
                step="0.01"
                required
            >

            <label for="category">
                Category
            </label>

            <select
                id="category"
                name="category"
                required
            >
                <option value="">
                    Select a category
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Transport">
                    Transport
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="Health">
                    Health
                </option>

                <option value="Other">
                    Other
                </option>
            </select>

            <button type="submit">
                Add Expense
            </button>

        </form>

        <a
            class="back"
            href="/"
        >
            ← Back to Dashboard
        </a>

    </div>

</main>

</body>

</html>
