<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | Raremotion Labs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: rgba(15, 23, 42, 0.6);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.1);
        }
        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 40px 8%;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }
        .admin-title h1 {
            font-size: 2.5rem;
            background: linear-gradient(to bottom, #fff 40%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            display: block;
        }
        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .leads-table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            color: var(--accent);
            font-size: 0.9rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
            font-size: 0.95rem;
        }
        tr:hover {
            background: rgba(255,255,255,0.02);
        }
        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: 1px solid var(--accent);
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="admin-title">
            <h1>Command Center</h1>
            <p style="color: var(--text-muted);">Raremotion Labs Internal Management</p>
        </div>
        <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Back to Site</a>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-value">{{ leads|length }}</span>
            <span class="stat-label">Total Leads</span>
        </div>
        <div class="stat-card">
            <span class="stat-value">Active</span>
            <span class="stat-label">System Status</span>
        </div>
    </div>

    <div class="leads-table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Project Details</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for lead in leads %}
                <tr>
                    <td>{{ lead.date }}</td>
                    <td>{{ lead.name }}</td>
                    <td>{{ lead.email }}</td>
                    <td>{{ lead.project_details }}</td>
                    <td><span class="badge">New</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
